<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>掃描中 · WebAR</title>
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    .example-container { overflow: hidden; position: absolute; inset: 0; width: 100%; height: 100%; isolation: isolate; }
    .example-container a-scene { width: 100%; height: 100%; background: transparent !important; }
    .example-container video {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      z-index: 0 !important;
      opacity: 1 !important;
      display: block !important;
    }
    .a-canvas, canvas.a-canvas {
      position: absolute !important;
      inset: 0 !important;
      z-index: 1 !important;
      background: transparent !important;
      mix-blend-mode: screen;
    }
    .a-enter-vr, .a-enter-ar { display: none !important; }
    a.back { position: fixed; top: 8px; left: 8px; z-index: 30; color: #fff; text-decoration: none; font-size: 13px; background: rgba(0,0,0,.5); padding: 6px 10px; border-radius: 999px; }
    #dbg { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 30; color: #9f6; font: 12px/1.4 ui-monospace, monospace; background: rgba(0,0,0,.55); padding: 8px; border-radius: 8px; pointer-events: none; }
    #inapp { display: none; position: fixed; inset: 0; z-index: 50; background: #070b14; color: #e8eef7; padding: 28px 20px; font-family: "PingFang TC","Noto Sans TC",sans-serif; }
    #inapp.show { display: flex; flex-direction: column; justify-content: center; gap: 12px; text-align: center; }
    #inapp a, #inapp button { display: block; width: 100%; max-width: 360px; margin: 0 auto; padding: 14px; border-radius: 14px; font-weight: 700; border: 0; text-decoration: none; }
    #inapp .go { background: #f4d35e; color: #111; }
    #inapp .copy { background: transparent; color: #e8eef7; border: 1px solid #334155; }
  </style>
  <script>
    AFRAME.registerComponent("show-camera", {
      init: function () {
        var sceneEl = this.el;
        function reveal() {
          var video = sceneEl.parentNode && sceneEl.parentNode.querySelector("video");
          if (!video) return;
          video.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:1;display:block;";
          var canvas = sceneEl.querySelector("canvas");
          if (canvas) canvas.style.mixBlendMode = "screen";
        }
        sceneEl.addEventListener("renderstart", reveal);
        sceneEl.addEventListener("arReady", reveal);
        setTimeout(reveal, 500);
        setTimeout(reveal, 1500);
        setTimeout(reveal, 3000);
      }
    });
    AFRAME.registerComponent("lock-to-target", {
      init: function () {
        this.el.object3D.matrixAutoUpdate = false;
        var dbg = document.querySelector("#dbg");
        this.el.addEventListener("targetFound", function () {
          dbg.textContent = "已鎖定圖案，請左右移動手機";
        });
        this.el.addEventListener("targetLost", function () {
          dbg.textContent = "尚未鎖定：對準整張黃框海報";
        });
      },
      tick: function () {
        this.el.object3D.matrixAutoUpdate = false;
        var dbg = document.querySelector("#dbg");
        if (!this.el.object3D.visible) return;
        var e = this.el.object3D.matrix.elements;
        dbg.textContent = "鎖定中 x=" + e[12].toFixed(2) + " y=" + e[13].toFixed(2) + " z=" + e[14].toFixed(2);
      }
    });
  </script>
</head>
<body>
  <div id="inapp">
    <h2>請用 Chrome 或 Safari 開啟</h2>
    <p>WhatsApp / Line 內建瀏覽器不能開相機。</p>
    <a class="go" id="open-external" href="#">用 Chrome 開啟</a>
    <button class="copy" id="copy-link" type="button">複製連結</button>
    <p id="ios-hint" hidden>iPhone：點「⋯」→「在 Safari 開啟」。</p>
  </div>
  <a class="back" href="./index.html">返回</a>
  <div id="dbg">尚未鎖定：對準整張黃框海報</div>

  <div class="example-container">
    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets.mind;"
      show-camera
      embedded
      color-space="sRGB"
      background="transparent: true"
      renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <img id="overlay-still" src="./assets/overlay.png" />
      </a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0" lock-to-target>
        <a-plane src="#overlay-still" position="0 0 0.03" width="1" height="1.25"></a-plane>
        <a-box position="0 0.7 0.15" width="0.25" height="0.25" depth="0.25" color="#ff4d00"></a-box>
      </a-entity>
    </a-scene>
  </div>
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var inApp = /WhatsApp|WABusiness|FBAN|FBAV|Instagram|Line\/|Messenger|Twitter|TikTok|Snapchat|MicroMessenger|WeChat|wv\)/i.test(ua);
      if (!inApp) return;
      document.getElementById("inapp").classList.add("show");
      var isIOS = /iPad|iPhone|iPod/.test(ua);
      var isAndroid = /Android/i.test(ua);
      var page = location.href.split("#")[0];
      var open = document.getElementById("open-external");
      if (isAndroid) {
        var u = new URL(page);
        open.href = "intent://" + u.host + u.pathname + u.search + "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(page) + ";end";
      } else if (isIOS) {
        open.href = page.replace(/^https:/, "x-safari-https:");
        open.textContent = "嘗試用 Safari 開啟";
        document.getElementById("ios-hint").hidden = false;
      }
      document.getElementById("copy-link").onclick = function () {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(page);
          this.textContent = "已複製，請貼到 Chrome";
        } else window.prompt("請複製這個連結", page);
      };
    })();
  </script>
</body>
</html>
